<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Background -->
  <rect width="800" height="800" rx="80" fill="#1a2a48"/>

  <!-- Concept v3: Clean geometric - three thick D letterforms
       arranged so their flat backs literally form a room corner (like looking at
       the inside corner of a room from above at an angle)

       Back of D1 = left wall
       Back of D2 = right wall
       Back of D3 = floor

       The curves (bowls) extend outward from the room -->

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#a8c8e4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8c8e4"/>
      <stop offset="100%" stop-color="#6a98d4"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb87a"/>
      <stop offset="100%" stop-color="#ff9b5c"/>
    </linearGradient>
  </defs>

  <g transform="translate(400, 400)">
    <!-- D1: Left wall — vertical, straight back on right side, bowl curves left -->
    <g transform="translate(-10, 0) skewY(-15)">
      <rect x="-12" y="-160" width="24" height="240" rx="4" fill="url(#g1)"/>
      <path d="M -12,-160 C -120,-160 -160,-80 -160,-40 C -160,0 -120,80 -12,80"
            fill="none" stroke="url(#g1)" stroke-width="24" stroke-linecap="round"/>
    </g>

    <!-- D2: Right wall — vertical, straight back on left side, bowl curves right -->
    <g transform="translate(10, 0) skewY(15)">
      <rect x="-12" y="-160" width="24" height="240" rx="4" fill="url(#g2)"/>
      <path d="M 12,-160 C 120,-160 160,-80 160,-40 C 160,0 120,80 12,80"
            fill="none" stroke="url(#g2)" stroke-width="24" stroke-linecap="round"/>
    </g>

    <!-- D3: Floor — horizontal, straight back at top, bowl curves down -->
    <g transform="translate(0, 80)">
      <rect x="-120" y="-12" width="240" height="24" rx="4" fill="url(#g3)"/>
      <path d="M -120,12 C -120,100 -60,140 0,140 C 60,140 120,100 120,12"
            fill="none" stroke="url(#g3)" stroke-width="24" stroke-linecap="round"/>
    </g>
  </g>
</svg>

<!doctype html>

<title>DaydreamDwelling — Builder Redesign</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: #0a0a12; }
  #root { height: 100%; }
  button { font-family: inherit; }
  input, select { font-family: inherit; }
  /* slim scrollbars inside sheets */
  .ddd-sheet-body::-webkit-scrollbar, .ddd-chips::-webkit-scrollbar { height: 0; width: 6px; }
  .ddd-sheet-body::-webkit-scrollbar-thumb { background: rgba(140,120,180,0.35); border-radius: 3px; }
  .ddd-chips { scrollbar-width: none; }
  .ddd-chips::-webkit-scrollbar { display: none; }
  @keyframes dddFlash { 0% { opacity: 0; } 30% { opacity: 0.9; } 100% { opacity: 0; } }
  select option { color: #222; }
  * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
</style>
</head>
